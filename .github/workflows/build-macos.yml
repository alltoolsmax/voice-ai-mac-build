name: Build macOS
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: apple-silicon }
          - { os: macos-15-intel, label: intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-desktop/voice-ai-app/package-lock.json
      - name: Build .dmg
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
      - name: Dua .dmg len Releases (khong tinh vao quota artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mac-${{ github.run_id }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Mac build $TAG" --notes "Ban build macOS"
          gh release upload "$TAG" dist/*.dmg --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: voice-ai-macos-${{ matrix.label }}
          path: dist/*.dmg
          if-no-files-found: error
