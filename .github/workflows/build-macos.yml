name: Build macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: apple }
          - { os: macos-15-intel, label: intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-desktop/voice-ai-app/package-lock.json
      - name: Build .dmg
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
      - name: Phien ban
        id: ver
        run: echo "ver=$(sed -n 's/^#define AppVersion *"\(.*\)".*/\1/p' scripts/installer.iss)" >> "$GITHUB_OUTPUT"
      - name: Dua .dmg len Releases (tag v<phien ban>) - may Mac cua khach tu cap nhat tu day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.ver }}"
          mkdir -p out
          cp dist/*.dmg "out/Voice-AI-MrHuynh-v${{ steps.ver.outputs.ver }}-mac-${{ matrix.label }}.dmg"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Voice AI - Mr Huynh $TAG (macOS)" \
              --notes "Ban macOS. Phan mem Voice AI tren Mac tu cap nhat tu day (khong qua hosting). *-mac-apple.dmg cho chip Apple M, *-mac-intel.dmg cho Mac Intel." --latest \
              --target "${{ github.sha }}" || sleep 10
          gh release upload "$TAG" out/* --clobber

